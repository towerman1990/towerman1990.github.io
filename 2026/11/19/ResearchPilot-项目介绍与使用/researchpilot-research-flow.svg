<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1700" viewBox="0 0 960 1700" role="img" aria-labelledby="title desc"><title id="title">ResearchPilot · 发起研究的流程</title><desc id="desc">同一会话延续主题；每轮独立执行、归档证据并生成报告。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#657996"/></marker><marker id="back" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9 0 L0 4.5 L9 9 Z" fill="#657996"/></marker></defs><rect width="960" height="1700" rx="16" fill="white"/><g font-family="Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif"><path d="M305 190 V220" fill="none" stroke="#657996" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M485 270 H650" fill="none" stroke="#657996" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M790 225 V95 H305 V110" fill="none" stroke="#657996" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M305 325 V370" fill="none" stroke="#657996" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M305 470 V520" fill="none" stroke="#657996" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M305 605 V655" fill="none" stroke="#657996" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M305 755 V805" fill="none" stroke="#657996" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M305 905 V955" fill="none" stroke="#657996" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M485 1010 H655" fill="none" stroke="#657996" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M790 955 V895" fill="none" stroke="#657996" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M650 850 H560" fill="none" stroke="#657996" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M790 1065 V1140" fill="none" stroke="#657996" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M650 1209 H560" fill="none" stroke="#657996" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M790 1250 V1470" fill="none" stroke="#657996" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M305 1065 V1160" fill="none" stroke="#657996" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M305 1260 V1310" fill="none" stroke="#657996" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M305 1410 V1470" fill="none" stroke="#657996" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="30" y="42" text-anchor="start" font-size="28" fill="#182540" font-weight="700"><tspan x="30" dy="0">ResearchPilot · 发起研究的流程</tspan></text><text x="30" y="76" text-anchor="start" font-size="17" fill="#64748b" font-weight="400"><tspan x="30" dy="0">同一会话延续主题；每轮独立执行、归档证据并生成报告。</tspan></text><rect x="50" y="110" width="510" height="80" rx="13" fill="#eff4ff" stroke="#a8bcef" stroke-width="1.5"/><text x="305" y="141" text-anchor="middle" font-size="21" fill="#182540" font-weight="650"><tspan x="305" dy="0">输入问题 / 在会话内继续提问</tspan></text><text x="305" y="171" text-anchor="middle" font-size="18" fill="#263650" font-weight="400"><tspan x="305" dy="0">可附公开链接、资料与研究选项</tspan></text><path d="M305 220 L485 270 L305 320 L125 270 Z" fill="#fff8e9" stroke="#d8b66d" stroke-width="1.5"/><text x="305" y="262" text-anchor="middle" font-size="19" fill="#634b1a" font-weight="600"><tspan x="305" dy="0">身份与研究额度</tspan><tspan x="305" dy="29">是否满足？</tspan></text><rect x="650" y="225" width="280" height="90" rx="13" fill="#fff8e9" stroke="#e4c98b" stroke-width="1.5"/><text x="790" y="256" text-anchor="middle" font-size="21" fill="#182540" font-weight="650"><tspan x="790" dy="0">登录 / 注册 / 配置模型</tspan></text><text x="790" y="286" text-anchor="middle" font-size="18" fill="#263650" font-weight="400"><tspan x="790" dy="0">处理后重新提交</tspan></text><rect x="50" y="370" width="510" height="100" rx="13" fill="#eff4ff" stroke="#a8bcef" stroke-width="1.5"/><text x="305" y="401" text-anchor="middle" font-size="21" fill="#182540" font-weight="650"><tspan x="305" dy="0">事务创建研究任务</tspan></text><text x="305" y="431" text-anchor="middle" font-size="18" fill="#263650" font-weight="400"><tspan x="305" dy="0">锁定会话并分配轮次，写入任务与 Outbox</tspan><tspan x="305" dy="29">保存偏好和模型快照，成功提交计次</tspan></text><rect x="50" y="520" width="510" height="85" rx="13" fill="#eff4ff" stroke="#a8bcef" stroke-width="1.5"/><text x="305" y="551" text-anchor="middle" font-size="21" fill="#182540" font-weight="650"><tspan x="305" dy="0">异步派发与领取</tspan></text><text x="305" y="581" text-anchor="middle" font-size="18" fill="#263650" font-weight="400"><tspan x="305" dy="0">Outbox → Redis / Asynq → Worker</tspan></text><rect x="50" y="655" width="510" height="100" rx="13" fill="#eff4ff" stroke="#a8bcef" stroke-width="1.5"/><text x="305" y="686" text-anchor="middle" font-size="21" fill="#182540" font-weight="650"><tspan x="305" dy="0">准备本轮上下文</tspan></text><text x="305" y="716" text-anchor="middle" font-size="18" fill="#263650" font-weight="400"><tspan x="305" dy="0">读取模型与偏好快照</tspan><tspan x="305" dy="29">加载长期记忆和会话近期报告背景</tspan></text><rect x="50" y="805" width="510" height="100" rx="13" fill="#eff4ff" stroke="#a8bcef" stroke-width="1.5"/><text x="305" y="836" text-anchor="middle" font-size="21" fill="#182540" font-weight="650"><tspan x="305" dy="0">检索与采集证据</tspan></text><text x="305" y="866" text-anchor="middle" font-size="18" fill="#263650" font-weight="400"><tspan x="305" dy="0">可选知识库检索；不足时规划、审批与调用工具</tspan><tspan x="305" dy="29">归档来源，保存已完成步骤的检查点</tspan></text><path d="M305 955 L485 1010 L305 1065 L125 1010 Z" fill="#fff8e9" stroke="#d8b66d" stroke-width="1.5"/><text x="305" y="1002" text-anchor="middle" font-size="19" fill="#634b1a" font-weight="600"><tspan x="305" dy="0">证据是否覆盖</tspan><tspan x="305" dy="29">研究目标？</tspan></text><path d="M790 955 L925 1010 L790 1065 L655 1010 Z" fill="#fff8e9" stroke="#d8b66d" stroke-width="1.5"/><text x="790" y="1002" text-anchor="middle" font-size="19" fill="#634b1a" font-weight="600"><tspan x="790" dy="0">可重规划且</tspan><tspan x="790" dy="29">仍有预算？</tspan></text><rect x="650" y="805" width="280" height="90" rx="13" fill="#fff8e9" stroke="#e4c98b" stroke-width="1.5"/><text x="790" y="836" text-anchor="middle" font-size="21" fill="#182540" font-weight="650"><tspan x="790" dy="0">按证据缺口重规划</tspan></text><text x="790" y="866" text-anchor="middle" font-size="18" fill="#263650" font-weight="400"><tspan x="790" dy="0">继续获取缺失资料</tspan></text><rect x="650" y="1140" width="280" height="110" rx="13" fill="#fff8e9" stroke="#e4c98b" stroke-width="1.5"/><text x="790" y="1171" text-anchor="middle" font-size="21" fill="#182540" font-weight="650"><tspan x="790" dy="0">保留已取得的材料</tspan></text><text x="790" y="1201" text-anchor="middle" font-size="18" fill="#263650" font-weight="400"><tspan x="790" dy="0">有资料：标记证据缺口</tspan><tspan x="790" dy="29">无可用资料：结束为失败</tspan></text><rect x="50" y="1160" width="510" height="100" rx="13" fill="#eff4ff" stroke="#a8bcef" stroke-width="1.5"/><text x="305" y="1191" text-anchor="middle" font-size="21" fill="#182540" font-weight="650"><tspan x="305" dy="0">形成有依据的报告草稿</tspan></text><text x="305" y="1221" text-anchor="middle" font-size="18" fill="#263650" font-weight="400"><tspan x="305" dy="0">可选证据分析员交接笔记</tspan><tspan x="305" dy="29">撰稿员结合归档原文生成带引用结论</tspan></text><rect x="50" y="1310" width="510" height="100" rx="13" fill="#eff4ff" stroke="#a8bcef" stroke-width="1.5"/><text x="305" y="1341" text-anchor="middle" font-size="21" fill="#182540" font-weight="650"><tspan x="305" dy="0">校验来源与引用</tspan></text><text x="305" y="1371" text-anchor="middle" font-size="18" fill="#263650" font-weight="400"><tspan x="305" dy="0">可选引用审核员复核</tspan><tspan x="305" dy="29">过滤不支持的结论，必要时回退为资料摘录</tspan></text><rect x="50" y="1470" width="510" height="100" rx="13" fill="#effaf7" stroke="#94cbbb" stroke-width="1.5"/><text x="305" y="1501" text-anchor="middle" font-size="21" fill="#182540" font-weight="650"><tspan x="305" dy="0">归档并发布完整 / 部分报告</tspan></text><text x="305" y="1531" text-anchor="middle" font-size="18" fill="#263650" font-weight="400"><tspan x="305" dy="0">SSE 更新状态，可导出或在原会话继续提问</tspan></text><rect x="650" y="1470" width="280" height="90" rx="13" fill="#fff1f0" stroke="#e4aaa3" stroke-width="1.5"/><text x="790" y="1501" text-anchor="middle" font-size="21" fill="#182540" font-weight="650"><tspan x="790" dy="0">研究失败</tspan></text><text x="790" y="1531" text-anchor="middle" font-size="18" fill="#263650" font-weight="400"><tspan x="790" dy="0">保留运行记录以便排查</tspan></text><text x="570" y="253" text-anchor="middle" font-size="17" fill="#536582" stroke="white" stroke-width="7" paint-order="stroke">否</text><text x="329" y="353" text-anchor="middle" font-size="17" fill="#536582" stroke="white" stroke-width="7" paint-order="stroke">是</text><text x="570" y="992" text-anchor="middle" font-size="17" fill="#536582" stroke="white" stroke-width="7" paint-order="stroke">否</text><text x="814" y="931" text-anchor="middle" font-size="17" fill="#536582" stroke="white" stroke-width="7" paint-order="stroke">是</text><text x="605" y="833" text-anchor="middle" font-size="17" fill="#536582" stroke="white" stroke-width="7" paint-order="stroke">补充取证</text><text x="812" y="1112" text-anchor="middle" font-size="17" fill="#536582" stroke="white" stroke-width="7" paint-order="stroke">否</text><text x="604" y="1191" text-anchor="middle" font-size="17" fill="#536582" stroke="white" stroke-width="7" paint-order="stroke">有资料</text><text x="848" y="1405" text-anchor="middle" font-size="17" fill="#536582" stroke="white" stroke-width="7" paint-order="stroke">无可用资料</text><text x="329" y="1122" text-anchor="middle" font-size="17" fill="#536582" stroke="white" stroke-width="7" paint-order="stroke">是</text><text x="30" y="1628" text-anchor="start" font-size="17" fill="#64748b" font-weight="400"><tspan x="30" dy="0">证据不足但仍有材料时，可尝试生成并复核部分结论；无法形成结论时保留归档摘录。</tspan></text><text x="30" y="1661" text-anchor="start" font-size="17" fill="#64748b" font-weight="400"><tspan x="30" dy="0">执行中可取消；不可恢复的错误可能提前结束。恢复执行时复用已提交的检查点。</tspan></text></g></svg>