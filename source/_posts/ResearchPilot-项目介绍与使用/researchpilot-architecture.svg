<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1010" viewBox="0 0 960 1010" role="img" aria-labelledby="title desc"><title id="title">ResearchPilot · 项目架构</title><desc id="desc">研究主链路：会话组织多轮研究，任务在后台执行，结论与证据持久化。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#657996"/></marker><marker id="back" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9 0 L0 4.5 L9 9 Z" fill="#657996"/></marker></defs><rect width="960" height="1010" rx="16" fill="white"/><g font-family="Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif"><path d="M250 155 H320" fill="none" stroke="#657996" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M320 185 H290 V250 H140 V210" fill="none" stroke="#657996" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M625 165 H710" fill="none" stroke="#657996" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#back)"/><path d="M710 308 H625" fill="none" stroke="#657996" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M473 346 V410" fill="none" stroke="#657996" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M473 486 V550" fill="none" stroke="#657996" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M625 600 H820 V350" fill="none" stroke="#657996" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#back)"/><path d="M380 660 V705 H173 V760" fill="none" stroke="#657996" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M480 660 V760" fill="none" stroke="#657996" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M570 660 V705 H787 V760" fill="none" stroke="#657996" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="30" y="42" text-anchor="start" font-size="28" fill="#182540" font-weight="700"><tspan x="30" dy="0">ResearchPilot · 项目架构</tspan></text><text x="30" y="76" text-anchor="start" font-size="17" fill="#64748b" font-weight="400"><tspan x="30" dy="0">研究主链路：会话组织多轮研究，任务在后台执行，结论与证据持久化。</tspan></text><rect x="30" y="120" width="220" height="90" rx="13" fill="#eff4ff" stroke="#a8bcef" stroke-width="1.5"/><text x="140" y="151" text-anchor="middle" font-size="21" fill="#182540" font-weight="650"><tspan x="140" dy="0">浏览器 / Windows</tspan></text><text x="140" y="181" text-anchor="middle" font-size="18" fill="#263650" font-weight="400"><tspan x="140" dy="0">React 工作台</tspan></text><rect x="320" y="120" width="305" height="90" rx="13" fill="#eff4ff" stroke="#a8bcef" stroke-width="1.5"/><text x="472.5" y="151" text-anchor="middle" font-size="21" fill="#182540" font-weight="650"><tspan x="472.5" dy="0">Go + Hertz API</tspan></text><text x="472.5" y="181" text-anchor="middle" font-size="18" fill="#263650" font-weight="400"><tspan x="472.5" dy="0">认证、额度、会话与任务</tspan></text><rect x="710" y="120" width="220" height="230" rx="13" fill="#effaf7" stroke="#94cbbb" stroke-width="1.5"/><text x="820" y="151" text-anchor="middle" font-size="21" fill="#182540" font-weight="650"><tspan x="820" dy="0">MySQL</tspan></text><text x="820" y="181" text-anchor="middle" font-size="18" fill="#263650" font-weight="400"><tspan x="820" dy="0">会话、任务与 Outbox</tspan><tspan x="820" dy="29">事件、检查点和证据</tspan><tspan x="820" dy="29">报告、偏好和模型配置</tspan><tspan x="820" dy="29">研究使用统计</tspan></text><rect x="320" y="270" width="305" height="76" rx="13" fill="#eff4ff" stroke="#a8bcef" stroke-width="1.5"/><text x="472.5" y="301" text-anchor="middle" font-size="21" fill="#182540" font-weight="650"><tspan x="472.5" dy="0">Outbox 派发器</tspan></text><text x="472.5" y="331" text-anchor="middle" font-size="18" fill="#263650" font-weight="400"><tspan x="472.5" dy="0">读取待派发记录</tspan></text><rect x="320" y="410" width="305" height="76" rx="13" fill="#eff4ff" stroke="#a8bcef" stroke-width="1.5"/><text x="472.5" y="441" text-anchor="middle" font-size="21" fill="#182540" font-weight="650"><tspan x="472.5" dy="0">Redis + Asynq</tspan></text><text x="472.5" y="471" text-anchor="middle" font-size="18" fill="#263650" font-weight="400"><tspan x="472.5" dy="0">队列与异步派发</tspan></text><rect x="320" y="550" width="305" height="110" rx="13" fill="#eff4ff" stroke="#a8bcef" stroke-width="1.5"/><text x="472.5" y="581" text-anchor="middle" font-size="21" fill="#182540" font-weight="650"><tspan x="472.5" dy="0">Worker + Eino</tspan></text><text x="472.5" y="611" text-anchor="middle" font-size="18" fill="#263650" font-weight="400"><tspan x="472.5" dy="0">规划 → 取证 → 检查 → 报告</tspan><tspan x="472.5" dy="29">租约、预算与检查点恢复</tspan></text><rect x="30" y="760" width="285" height="145" rx="13" fill="#effaf7" stroke="#94cbbb" stroke-width="1.5"/><text x="172.5" y="791" text-anchor="middle" font-size="21" fill="#182540" font-weight="650"><tspan x="172.5" dy="0">联网取证工具</tspan></text><text x="172.5" y="821" text-anchor="middle" font-size="18" fill="#263650" font-weight="400"><tspan x="172.5" dy="0">公开网页 / GitHub 固定提交</tspan><tspan x="172.5" dy="29">Microsoft Learn MCP</tspan><tspan x="172.5" dy="29">Brave Search（可选）</tspan></text><rect x="338" y="760" width="285" height="145" rx="13" fill="#effaf7" stroke="#94cbbb" stroke-width="1.5"/><text x="480.5" y="791" text-anchor="middle" font-size="21" fill="#182540" font-weight="650"><tspan x="480.5" dy="0">知识库检索 · RAG</tspan></text><text x="480.5" y="821" text-anchor="middle" font-size="18" fill="#263650" font-weight="400"><tspan x="480.5" dy="0">公开摘要 / 私有文档</tspan><tspan x="480.5" dy="29">关键词；可选向量 + RRF</tspan><tspan x="480.5" dy="29">Milvus 为可选后端</tspan></text><rect x="645" y="760" width="285" height="145" rx="13" fill="#effaf7" stroke="#94cbbb" stroke-width="1.5"/><text x="787.5" y="791" text-anchor="middle" font-size="21" fill="#182540" font-weight="650"><tspan x="787.5" dy="0">模型服务</tspan></text><text x="787.5" y="821" text-anchor="middle" font-size="18" fill="#263650" font-weight="400"><tspan x="787.5" dy="0">OpenAI 兼容接口</tspan><tspan x="787.5" dy="29">规划、证据分析、报告撰写</tspan><tspan x="787.5" dy="29">可选多 Agent 与引用复核</tspan></text><text x="285" y="110" text-anchor="middle" font-size="17" fill="#536582" stroke="white" stroke-width="7" paint-order="stroke">HTTP 请求</text><text x="159" y="278" text-anchor="middle" font-size="17" fill="#536582" stroke="white" stroke-width="7" paint-order="stroke">SSE 进度 / 重连回放</text><text x="668" y="150" text-anchor="middle" font-size="17" fill="#536582" stroke="white" stroke-width="7" paint-order="stroke">读写</text><text x="667" y="294" text-anchor="middle" font-size="17" fill="#536582" stroke="white" stroke-width="7" paint-order="stroke">读取</text><text x="497" y="385" text-anchor="middle" font-size="17" fill="#536582" stroke="white" stroke-width="7" paint-order="stroke">派发</text><text x="516" y="527" text-anchor="middle" font-size="17" fill="#536582" stroke="white" stroke-width="7" paint-order="stroke">领取任务</text><text x="786" y="626" text-anchor="middle" font-size="17" fill="#536582" stroke="white" stroke-width="7" paint-order="stroke">状态 / 事件 / 证据 / 检查点</text><text x="526" y="727" text-anchor="middle" font-size="17" fill="#536582" stroke="white" stroke-width="7" paint-order="stroke">按需调用</text><text x="30" y="947" text-anchor="start" font-size="17" fill="#64748b" font-weight="400"><tspan x="30" dy="0">线上默认采用关键词检索；向量检索和 Milvus 是可选配置，未部署到当前生产环境。</tspan></text><text x="30" y="978" text-anchor="start" font-size="17" fill="#64748b" font-weight="400"><tspan x="30" dy="0">项目另提供独立 stdio MCP 服务，供外部客户端只读检索同一公开知识库。</tspan></text></g></svg>